[project]
name = "lazy-asr"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "soundfile>=0.13.1",
    "numpy>=1.24.0",
    "onnxruntime>=1.20.0",
    "dashscope>=1.24.6",
    "requests>=2.32.5",
    "python-multipart>=0.0.9",
    "tqdm>=4.67.1",
    "structlog>=23.0.0",
    "faster-whisper>=1.1.0",
    "ffmpeg-python>=0.2.0",
    "asyncio>=4.0.0",
    "filetype>=1.2.0",
    "websockets>=16.0",
    "ten-vad>=1.0.6.8",
    "typer>=0.12.0",      # CLI framework
    "rich>=13.0.0",       # Terminal formatting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "ruff>=0.9.0",
]

[project.scripts]
lazy-asr = "app.cli.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "plugins*"]
exclude = ["tests*", "data*", "models*", "output*", "uploads*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_any_unimported = false
ignore_missing_imports = true
check_untyped_defs = false
no_implicit_optional = false
warn_unused_ignores = false
disable_error_code = [
    "assignment",
    "arg-type",
    "return-value",
    "var-annotated",
    "valid-type",
    "misc",
    "type-var",
]

[[tool.mypy.overrides]]
module = [
    "filetype.*",
    "ffmpeg.*",
    "soundfile.*",
    "onnxruntime.*",
    "faster_whisper.*",
    "dashscope.*",
    "tqdm.*",
    "requests.*",
]
ignore_missing_imports = true
